name: Deploy Gravitas VPN

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: gravitas-vpn-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.HOST }}
      SSHPASS: ${{ secrets.PASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HOST:-}" ]] || { echo 'Missing GitHub secret: HOST'; exit 1; }
          [[ -n "${SSHPASS:-}" ]] || { echo 'Missing GitHub secret: PASS'; exit 1; }

      - name: Install deployment and smoke-test tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y sshpass wireguard-tools iputils-ping

      - name: Copy deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3'
          sshpass -e ssh ${SSH_OPTS} root@"${HOST}" 'mkdir -p /opt/gravitas-vpn/scripts && chmod 700 /opt/gravitas-vpn'
          sshpass -e scp ${SSH_OPTS} scripts/setup_wireguard.sh scripts/manage_peer.sh root@"${HOST}":/opt/gravitas-vpn/scripts/

      - name: Configure WireGuard
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3'
          sshpass -e ssh ${SSH_OPTS} root@"${HOST}" "chmod 700 /opt/gravitas-vpn/scripts/*.sh && /opt/gravitas-vpn/scripts/setup_wireguard.sh '${HOST}'"

      - name: Verify server state
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
          sshpass -e ssh ${SSH_OPTS} root@"${HOST}" '
            set -e
            systemctl is-active --quiet wg-quick@wg0
            test "$(sysctl -n net.ipv4.ip_forward)" = "1"
            test -s /root/gravitas-vpn/clients/hossein.conf
            test -s /root/gravitas-vpn/clients/kiarash.conf
            test -s /root/gravitas-vpn/clients/ahmad.conf
            test -s /root/gravitas-vpn/clients/ehsan.conf
            echo "WireGuard service is active and all four Gravitas client configs exist on the server."
          '

      - name: Test WireGuard from outside the server
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
          CFG='/tmp/gravitas-ci-smoke.conf'

          cleanup() {
            sudo wg-quick down "${CFG}" >/dev/null 2>&1 || true
            rm -f "${CFG}"
            sshpass -e ssh ${SSH_OPTS} root@"${HOST}" 'gravitas-vpn-peer revoke ci-smoke >/dev/null 2>&1 || true' || true
          }
          trap cleanup EXIT

          sshpass -e ssh ${SSH_OPTS} root@"${HOST}" '
            if [ -d /etc/wireguard/gravitas/peers/ci-smoke ]; then
              gravitas-vpn-peer revoke ci-smoke >/dev/null 2>&1 || true
            fi
            gravitas-vpn-peer add ci-smoke >/dev/null
          '
          sshpass -e scp ${SSH_OPTS} root@"${HOST}":/root/gravitas-vpn/clients/ci-smoke.conf "${CFG}"
          chmod 600 "${CFG}"

          # The smoke test only routes the private VPN subnet, so the runner's own
          # GitHub traffic is never sent through the VPN.
          sed -i '/^DNS =/d' "${CFG}"
          sed -i 's#^AllowedIPs = 0.0.0.0/0#AllowedIPs = 10.77.0.0/24#' "${CFG}"

          sudo wg-quick up "${CFG}" >/dev/null
          ping -c 3 -W 3 10.77.0.1 >/dev/null

          HANDSHAKE="$(sudo wg show "$(basename "${CFG}" .conf)" latest-handshakes | awk '{print $2; exit}')"
          [[ -n "${HANDSHAKE}" && "${HANDSHAKE}" != "0" ]] || {
            echo 'WireGuard tunnel came up but no handshake was observed.' >&2
            exit 1
          }
          echo 'External WireGuard handshake and tunnel ping succeeded.'

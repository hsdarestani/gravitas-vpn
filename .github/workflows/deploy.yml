name: Deploy Gravitas VPN

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'panel/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: gravitas-vpn-production-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.HOST }}
      SSHPASS: ${{ secrets.PASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HOST:-}" ]] || { echo 'Missing GitHub secret: HOST'; exit 1; }
          [[ -n "${SSHPASS:-}" ]] || { echo 'Missing GitHub secret: PASS'; exit 1; }

      - name: Install SSH and network test tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y sshpass netcat-openbsd

      - name: Copy deployment assets
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3'
          sshpass -e ssh ${SSH_OPTS} root@"${HOST}" 'mkdir -p /opt/gravitas-vpn/scripts /opt/gravitas-vpn/panel && chmod 700 /opt/gravitas-vpn'
          sshpass -e scp ${SSH_OPTS} scripts/setup_xray.sh scripts/manage_xray_user.sh scripts/enable_xray_stats.sh scripts/setup_panel.sh root@"${HOST}":/opt/gravitas-vpn/scripts/
          sshpass -e scp ${SSH_OPTS} panel/app.py root@"${HOST}":/opt/gravitas-vpn/panel/app.py

      - name: Configure Xray VLESS Reality
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3'
          sshpass -e ssh ${SSH_OPTS} root@"${HOST}" "chmod 700 /opt/gravitas-vpn/scripts/*.sh && /opt/gravitas-vpn/scripts/setup_xray.sh '${HOST}'"

      - name: Enable Xray traffic statistics
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
          sshpass -e ssh ${SSH_OPTS} root@"${HOST}" '/opt/gravitas-vpn/scripts/enable_xray_stats.sh'

      - name: Install monitoring panel
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3'
          sshpass -e ssh ${SSH_OPTS} root@"${HOST}" "/opt/gravitas-vpn/scripts/setup_panel.sh '${HOST}'"

      - name: Verify Xray and panel state
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
          sshpass -e ssh ${SSH_OPTS} root@"${HOST}" '
            set -e
            systemctl is-active --quiet xray
            systemctl is-active --quiet gravitas-panel
            /usr/local/bin/xray run -test -config /usr/local/etc/xray/config.json
            /usr/local/bin/xray api statsquery --server=127.0.0.1:10085 -pattern "user>>>" >/dev/null
            test -s /etc/gravitas-xray/port
            test -s /etc/gravitas-panel/admin_password
            for user in hossein kiarash ahmad ehsan sajjad; do
              test -s "/root/gravitas-vpn/xray-clients/${user}.vless.txt"
              test -s "/root/gravitas-vpn/xray-clients/${user}.png"
              test -s "/root/gravitas-vpn/xray-clients/${user}.json"
              test -s "/root/gravitas-vpn/xray-clients/${user}-fallback.vless.txt"
              test -s "/root/gravitas-vpn/xray-clients/${user}-fallback.png"
              test -s "/root/gravitas-vpn/xray-clients/${user}-fallback.json"
            done
            PANEL_PASS="$(cat /etc/gravitas-panel/admin_password)"
            PANEL_JSON="$(curl -ksSf -u "admin:${PANEL_PASS}" https://127.0.0.1:9443/api/data)"
            printf "%s" "$PANEL_JSON" | jq -e ".system.panel_active == true and .system.xray_active == true and (.users | length == 5)" >/dev/null
            test "$(printf "%s" "$PANEL_JSON" | jq -r .collector_error)" = ""
            echo "Xray stats and Gravitas monitoring panel are healthy."
          '

      - name: Test public TCP reachability
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
          PORT="$(sshpass -e ssh ${SSH_OPTS} root@"${HOST}" 'cat /etc/gravitas-xray/port')"
          FALLBACK_PORT="$(sshpass -e ssh ${SSH_OPTS} root@"${HOST}" 'cat /etc/gravitas-xray/fallback-port')"
          [[ "$PORT" =~ ^[0-9]+$ ]] || { echo 'Invalid Xray port returned by server.' >&2; exit 1; }
          [[ "$FALLBACK_PORT" =~ ^[0-9]+$ ]] || { echo 'Invalid fallback Xray port returned by server.' >&2; exit 1; }
          nc -zvw 8 "${HOST}" "${PORT}"
          nc -zvw 8 "${HOST}" "${FALLBACK_PORT}"
          nc -zvw 8 "${HOST}" 9443
          echo "External reachability succeeded for Xray ${PORT}/tcp, fallback ${FALLBACK_PORT}/tcp and panel 9443/tcp."

      - name: End-to-end VLESS REALITY smoke test
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
          sudo bash -c "$(curl -fsSL https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install
          sshpass -e scp ${SSH_OPTS} root@"${HOST}":/root/gravitas-vpn/xray-clients/hossein.json /tmp/gravitas-primary.json
          sshpass -e scp ${SSH_OPTS} root@"${HOST}":/root/gravitas-vpn/xray-clients/hossein-fallback.json /tmp/gravitas-fallback.json
          chmod 600 /tmp/gravitas-primary.json /tmp/gravitas-fallback.json

          SERVER_EGRESS_V4="$(sshpass -e ssh ${SSH_OPTS} root@"${HOST}" "curl -4 -fsS --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | sed -n 's/^ip=//p' | head -n1")"
          SERVER_EGRESS_V6="$(sshpass -e ssh ${SSH_OPTS} root@"${HOST}" "curl -6 -fsS --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | sed -n 's/^ip=//p' | head -n1" || true)"
          [[ -n "${SERVER_EGRESS_V4}" || -n "${SERVER_EGRESS_V6}" ]] || { echo 'Could not determine server egress IP.' >&2; exit 1; }

          test_tunnel() {
            local cfg="$1"
            local label="$2"
            rm -f /tmp/gravitas-smoke.trace /tmp/gravitas-smoke.log

            /usr/local/bin/xray run -config "$cfg" >/tmp/gravitas-smoke.log 2>&1 &
            XRAY_PID=$!

            for _ in {1..30}; do
              if nc -z 127.0.0.1 10808 >/dev/null 2>&1; then break; fi
              sleep 0.3
            done
            nc -z 127.0.0.1 10808

            if ! curl -4 -fsS --max-time 20 --socks5-hostname 127.0.0.1:10808 https://www.cloudflare.com/cdn-cgi/trace >/tmp/gravitas-smoke.trace; then
              echo "${label} VLESS/REALITY tunnel request failed." >&2
              sed -E 's/(id|password|publicKey|privateKey)[=:][^ ,}]*/\1=REDACTED/g' /tmp/gravitas-smoke.log >&2 || true
              kill "${XRAY_PID}" 2>/dev/null || true
              wait "${XRAY_PID}" 2>/dev/null || true
              return 1
            fi

            TUNNEL_EGRESS="$(awk -F= '/^ip=/{print $2; exit}' /tmp/gravitas-smoke.trace)"
            kill "${XRAY_PID}" 2>/dev/null || true
            wait "${XRAY_PID}" 2>/dev/null || true

            [[ -n "${TUNNEL_EGRESS}" ]] || { echo "${label}: no tunnel egress IP returned." >&2; return 1; }
            if [[ "${TUNNEL_EGRESS}" != "${SERVER_EGRESS_V4}" && "${TUNNEL_EGRESS}" != "${SERVER_EGRESS_V6}" ]]; then
              echo "${label}: tunnel egress did not match server egress." >&2
              return 1
            fi
            echo "${label} VLESS/REALITY tunnel succeeded."
          }

          trap 'pkill -f "/usr/local/bin/xray run -config /tmp/gravitas-" 2>/dev/null || true; rm -f /tmp/gravitas-*.json /tmp/gravitas-smoke.*' EXIT
          test_tunnel /tmp/gravitas-primary.json "Primary"
          test_tunnel /tmp/gravitas-fallback.json "Fallback"
          echo "Both Gravitas REALITY paths passed end-to-end validation."

      - name: Collect Ahmad fallback bundle
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
          mkdir -p ahmad-fallback
          for suffix in vless.txt png json; do
            sshpass -e scp ${SSH_OPTS} root@"${HOST}":/root/gravitas-vpn/xray-clients/ahmad-fallback.${suffix} ahmad-fallback/
          done
          chmod -R go-rwx ahmad-fallback

      - name: Upload Ahmad fallback bundle
        uses: actions/upload-artifact@v4
        with:
          name: ahmad-gravitas-fallback
          path: ahmad-fallback/
          if-no-files-found: error
          retention-days: 1

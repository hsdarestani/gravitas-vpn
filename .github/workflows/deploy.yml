name: Deploy Gravitas VPN

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: gravitas-vpn-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.HOST }}
      SSHPASS: ${{ secrets.PASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HOST:-}" ]] || { echo 'Missing GitHub secret: HOST'; exit 1; }
          [[ -n "${SSHPASS:-}" ]] || { echo 'Missing GitHub secret: PASS'; exit 1; }

      - name: Install SSH and network test tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y sshpass netcat-openbsd

      - name: Copy Xray deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3'
          sshpass -e ssh ${SSH_OPTS} root@"${HOST}" 'mkdir -p /opt/gravitas-vpn/scripts && chmod 700 /opt/gravitas-vpn'
          sshpass -e scp ${SSH_OPTS} scripts/setup_xray.sh scripts/manage_xray_user.sh root@"${HOST}":/opt/gravitas-vpn/scripts/

      - name: Configure Xray VLESS Reality
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3'
          sshpass -e ssh ${SSH_OPTS} root@"${HOST}" "chmod 700 /opt/gravitas-vpn/scripts/*.sh && /opt/gravitas-vpn/scripts/setup_xray.sh '${HOST}'"

      - name: Verify Xray server state
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
          sshpass -e ssh ${SSH_OPTS} root@"${HOST}" '
            set -e
            systemctl is-active --quiet xray
            /usr/local/bin/xray run -test -config /usr/local/etc/xray/config.json
            test -s /etc/gravitas-xray/port
            test -s /root/gravitas-vpn/xray-clients/hossein.vless.txt
            test -s /root/gravitas-vpn/xray-clients/kiarash.vless.txt
            test -s /root/gravitas-vpn/xray-clients/ahmad.vless.txt
            test -s /root/gravitas-vpn/xray-clients/ehsan.vless.txt
            test -s /root/gravitas-vpn/xray-clients/hossein.png
            test -s /root/gravitas-vpn/xray-clients/kiarash.png
            test -s /root/gravitas-vpn/xray-clients/ahmad.png
            test -s /root/gravitas-vpn/xray-clients/ehsan.png
            echo "Xray is active and all four Gravitas client profiles exist on the server."
          '

      - name: Test public TCP reachability
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
          PORT="$(sshpass -e ssh ${SSH_OPTS} root@"${HOST}" 'cat /etc/gravitas-xray/port')"
          [[ "$PORT" =~ ^[0-9]+$ ]] || { echo 'Invalid Xray port returned by server.' >&2; exit 1; }
          nc -zvw 8 "${HOST}" "${PORT}"
          echo "External TCP reachability to Xray succeeded on port ${PORT}."

name: Diagnose VPN source IP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-source-ip.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      HOST: 91.107.245.200
      SSHPASS: ${{ secrets.PASS }}
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass
      - name: Inspect live routing
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
          sshpass -e ssh ${SSH_OPTS} root@"${HOST}" '
            set -e
            echo "=== GLOBAL IPV4 ==="
            ip -4 -o addr show scope global
            echo "=== ROUTES ==="
            ip -4 route
            echo "=== RULES ==="
            ip -4 rule
            echo "=== ROUTE GET 1.1.1.1 ==="
            ip -4 route get 1.1.1.1
            echo "=== PUBLIC IPV4 ==="
            curl -4 -fsS --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | sed -n "s/^ip=//p"
            echo "=== XRAY STATE ==="
            printf "saved-host="; cat /etc/gravitas-xray/host 2>/dev/null || true
            printf "saved-port="; cat /etc/gravitas-xray/port 2>/dev/null || true
            echo "=== XRAY LISTEN ==="
            ss -ltnp | grep -E ":(443|2053|2083|2096|8443|9443) " || true
          '

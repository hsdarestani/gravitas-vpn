name: Diagnose live Xray outbound

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-xray-outbound.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: 91.107.245.200
      SSHPASS: ${{ secrets.PASS }}
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass
      - name: Inspect Xray outbound and recent errors
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
          sshpass -e ssh ${SSH_OPTS} root@"${HOST}" '
            set -e
            echo "=== XRAY CONFIG SUMMARY ==="
            jq "{log:.log,outbounds:.outbounds,routing:.routing}" /usr/local/etc/xray/config.json
            echo "=== SERVER DNS ==="
            getent ahostsv4 www.cloudflare.com | head -n 3 || true
            echo "=== SERVER HTTP ==="
            curl -4 -I -sS --max-time 10 https://www.cloudflare.com | head -n 5 || true
            echo "=== XRAY RECENT LOG ==="
            journalctl -u xray --since "10 minutes ago" --no-pager -n 120 || true
          '

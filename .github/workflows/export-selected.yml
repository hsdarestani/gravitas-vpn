name: Export Selected Gravitas VPN Clients

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-selected.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: ${{ secrets.HOST }}
      SSHPASS: ${{ secrets.PASS }}
    steps:
      - name: Install SSH client
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y sshpass
      - name: Collect Ahmad and Hossein configs
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
          mkdir -p /tmp/ahmad /tmp/hossein
          for ext in vless.txt png json; do
            sshpass -e scp ${SSH_OPTS} root@"${HOST}":"/root/gravitas-vpn/xray-clients/ahmad.${ext}" "/tmp/ahmad/ahmad.${ext}"
            sshpass -e scp ${SSH_OPTS} root@"${HOST}":"/root/gravitas-vpn/xray-clients/hossein.${ext}" "/tmp/hossein/hossein.${ext}"
          done
          for ext in vless.txt png json; do
            sshpass -e scp ${SSH_OPTS} root@"${HOST}":"/root/gravitas-vpn/xray-clients/ahmad-fallback.${ext}" "/tmp/ahmad/ahmad-fallback.${ext}"
            sshpass -e scp ${SSH_OPTS} root@"${HOST}":"/root/gravitas-vpn/xray-clients/hossein-fallback.${ext}" "/tmp/hossein/hossein-fallback.${ext}"
          done
          grep -q '167.233.182.94' /tmp/ahmad/ahmad.vless.txt
          grep -q '167.233.182.94' /tmp/hossein/hossein.vless.txt
      - name: Upload Ahmad
        uses: actions/upload-artifact@v4
        with:
          name: ahmad-gravitas-vpn
          path: /tmp/ahmad/
          retention-days: 1
          if-no-files-found: error
      - name: Upload Hossein
        uses: actions/upload-artifact@v4
        with:
          name: hossein-gravitas-vpn
          path: /tmp/hossein/
          retention-days: 1
          if-no-files-found: error

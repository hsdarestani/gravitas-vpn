name: Read Hossein Xray stats

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/read-hossein-stats.yml'

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: 91.107.245.200
      SSHPASS: ${{ secrets.PASS }}
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass
      - name: Read Hossein traffic counters
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
          sshpass -e ssh ${SSH_OPTS} root@"${HOST}" '
            /usr/local/bin/xray api statsquery --server=127.0.0.1:10085 -pattern "user>>>hossein>>>traffic>>>" -reset=false
          '

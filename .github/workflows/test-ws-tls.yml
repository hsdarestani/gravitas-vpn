name: Test WS TLS path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-ws-tls.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HOST: 91.107.150.117
      SSHPASS: ${{ secrets.PASS }}
    steps:
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y sshpass netcat-openbsd
          sudo bash -c "$(curl -fsSL https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install

      - name: Fetch live WS TLS client
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
          sshpass -e scp ${SSH_OPTS} root@"${HOST}":/root/gravitas-vpn/xray-clients/hossein-ws-tls.json /tmp/gravitas-ws-tls.json
          chmod 600 /tmp/gravitas-ws-tls.json
          nc -zvw 8 91-107-150-117.sslip.io 2096

      - name: End to end WS TLS test
        shell: bash
        run: |
          set -euo pipefail
          /usr/local/bin/xray run -config /tmp/gravitas-ws-tls.json >/tmp/ws-tls.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          for _ in {1..30}; do
            nc -z 127.0.0.1 10808 >/dev/null 2>&1 && break
            sleep 0.3
          done
          nc -z 127.0.0.1 10808

          curl -4 -fsS --max-time 20 --socks5-hostname 127.0.0.1:10808 https://www.cloudflare.com/cdn-cgi/trace >/tmp/trace
          grep -q '^ip=' /tmp/trace
          echo "WS TLS tunnel passed end-to-end."
